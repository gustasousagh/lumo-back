spring:
  application:
    name: backend

  # ---------------------------------------------------------------------------
  # BANCO DE DADOS (MySQL). Nada de credencial fixa aqui: tudo vem de variáveis
  # de ambiente. Veja .env.example para a lista completa.
  #   DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
  # Se preferir, DB_URL sobrescreve a URL inteira de uma vez.
  #
  # createDatabaseIfNotExist: sem isso, subir num MySQL zerado falha com
  # "Unknown database" (erro 1049) — o Hibernate cria tabelas, não o database.
  # Só age quando o database não existe; se já existe, nem precisa de privilégio.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lumo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # 'update' cria/ajusta as tabelas sozinho. Em produção de verdade, troque
      # por 'validate' e versione o schema (Flyway/Liquibase).
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Upload. O teto aqui é do container (Tomcat) e precisa ser MAIOR que o limite
  # de negócio em app.library.max-*-mb — quem recusa por tamanho é o service, com
  # mensagem em português; se o Tomcat cortar antes, o usuário recebe um 500 seco.
  # max-request-size é alto porque o painel sobe uma pasta inteira de MP3 de uma vez.
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:256MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:2GB}

  # ===========================================================================
  #  Envio de email (confirmação de conta / reset de senha).
  #  Gmail: crie uma "Senha de app" em https://myaccount.google.com/apppasswords
  #  (precisa da verificação em 2 etapas ativada) e coloque em MAIL_PASSWORD.
  #  NUNCA commite a senha aqui — use as variáveis de ambiente.
  # ===========================================================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Catálogo de mídia (GoCine). O token vive só aqui — antes ficava no servidor
# do Next, o que impedia usar a API sem passar pelo front.
gocine:
  api-url: ${GOCINE_API_URL:}
  token: ${GOCINE_JWT_SECRET:}
  # Substitui o `revalidate: 300` que o Next fazia nas rotas de mídia.
  cache-minutes: ${GOCINE_CACHE_MINUTES:5}
  cache-max-entries: ${GOCINE_CACHE_MAX_ENTRIES:500}

# Configurações da própria aplicação
app:
  # URL do front (usada nos links dos emails de confirmação/reset)
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Emails promovidos a ADMIN no boot. Separe por vírgula.
  # Sem isso não existe o primeiro admin: o cadastro sempre cria usuário comum.
  admin-emails: ${ADMIN_EMAILS:}
  # Biblioteca de música e livros
  library:
    # Onde os arquivos ficam. Em produção, aponte para um volume persistente —
    # o diretório padrão vive dentro do container e some no próximo deploy.
    dir: ${LIBRARY_DIR:./data/library}
    # Limites por arquivo, em MB (o service recusa acima disso).
    max-audio-mb: ${LIBRARY_MAX_AUDIO_MB:80}
    max-book-mb: ${LIBRARY_MAX_BOOK_MB:200}
  # Remetente que aparece para o usuário. IMPORTANTE: o endereço precisa ser o
  # MESMO da conta autenticada (MAIL_USERNAME), senão o Gmail marca como spam ou
  # reescreve o "De". Por isso usamos o próprio username como endereço.
  mail-from: ${MAIL_FROM:Lumo 🎬 <${MAIL_USERNAME:}>}
  jwt:
    # Chave secreta do JWT (>= 32 caracteres). Em produção, use env JWT_SECRET.
    secret: ${JWT_SECRET:troque-esta-chave-super-secreta-de-pelo-menos-32-caracteres}
    # Validade do token em ms (aqui = 7 dias)
    expiration-ms: 604800000
  tokens:
    # Validade (em minutos) dos tokens de confirmação de email e reset de senha
    verification-expiration-minutes: 1440   # 24h
    reset-expiration-minutes: 60            # 1h

server:
  port: 8080
