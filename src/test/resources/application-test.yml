# Profile "test": sobrescreve só o banco, para o build não precisar de um MySQL
# vivo. O resto da config vem do application.yml principal.
spring:
  datasource:
    url: jdbc:h2:mem:lumo-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: chave-de-teste-com-pelo-menos-32-caracteres-ok
