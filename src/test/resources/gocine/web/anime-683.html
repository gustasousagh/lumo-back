:[{\"id\":48984,\"tmdbId\":1059121,\"number\":1,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Naruto Uzumaki Chegando!\",\"overview\":\"Bem-vindo \u00e0 Vila Secreta da Folha, onde ninjas mort\u00edferos vagam pela terra e o endiabrado Naruto Uzumaki causa problemas aonde quer que v\u00e1.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/7xOP0rKDniTZKEaRM7seKfY9SG8.jpg\",\"runtimeMinutes\":24,\"rating\":7.1,\"airDate\":\"2002-10-03\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48985,\"tmdbId\":1059122,\"number\":2,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Meu Nome \u00e9 Konohamaru!\",\"overview\":\"Naruto finalmente se forma na Academia Ninja e j\u00e1 acha que sabe tudo.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/5e0sxZupgkWNRvEnSn8CtDaTNck.jpg\",\"runtimeMinutes\":24,\"rating\":6.9,\"airDate\":\"2002-10-10\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48986,\"tmdbId\":1059123,\"number\":3,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Sasuke e Sakura: Amigos ou Inimigos?\",\"overview\":\"Para poder se tornar um ninja de verdade, Naruto precisa formar uma equipe com seus colegas, a bela Sakura e o sisudo Sasuke..\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/AnET8GFEtsVkhZCvNDYdo1OhFUZ.jpg\",\"runtimeMinutes\":24,\"rating\":7.4,\"airDate\":\"2002-10-17\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48987,\"tmdbId\":1059124,\"number\":4,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Aprovar ou Reprovar? Um Exerc\u00edcio de Sobreviv\u00eancia\",\"overview\":\"Agora que Naruto, Sasuke e Sakura s\u00e3o um time, eles se re\u00fanem com seu professor, o enigm\u00e1tico e distra\u00eddo Kakashi.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/754Qrt6RuRblgazi8LiZ26AkmzK.jpg\",\"runtimeMinutes\":24,\"rating\":8.1,\"airDate\":\"2002-10-24\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48988,\"tmdbId\":1059125,\"number\":5,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Voc\u00ea Falhou! A Decis\u00e3o Final de Kakashi\",\"overview\":\"Amea\u00e7ados pelo fracasso, Naruto, Sasuke e Sakura tentam tudo o que sabem para passar do excruciante teste de sobreviv\u00eancia.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/6DUDSdvZIq4ebWB56EXPWNIt7Yp.jpg\",\"runtimeMinutes\":24,\"rating\":8.2,\"airDate\":\"2002-10-31\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48989,\"tmdbId\":1059126,\"number\":6,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Uma Miss\u00e3o Perigosa: Uma Aventura no Pa\u00eds das Ondas!\",\"overview\":\"As primeiras miss\u00f5es ninja do time de Naruto s\u00e3o tarefas ma\u00e7antes. Cansado e furioso, Naruto desabafa com o Hokage.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/iFwElDN6atOMRNsTnO2xpGr9cfH.jpg\",\"runtimeMinutes\":24,\"rating\":8.2,\"airDate\":\"2002-11-07\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48990,\"tmdbId\":1059127,\"number\":7,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Assassino da N\u00e9voa!\",\"overview\":\"Naruto e seu time chegam \u00e0 Terra das Ondas, que descobrem ter sido dominada por um negociante chamado Gato.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/hCux6yOMEr0aTASISowEYR5HNm6.jpg\",\"runtimeMinutes\":24,\"rating\":7.9,\"airDate\":\"2002-11-14\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48991,\"tmdbId\":1059128,\"number\":8,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Juramento de Dor\",\"overview\":\"Kakashi leva a melhor na batalha contra Zabuza.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/aHB9h0MKT9SM56QDpFEAThWmfZw.jpg\",\"runtimeMinutes\":24,\"rating\":8.4,\"airDate\":\"2002-11-21\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48992,\"tmdbId\":1059129,\"number\":9,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Kakashi: O Guerreiro Sharingan\",\"overview\":\"Gra\u00e7as ao engenhoso plano de Naruto, Kakashi \u00e9 libertado da pris\u00e3o d'\u00e1gua.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/zPkIKMA53ysQZ2zj5inHwsXA2ME.jpg\",\"runtimeMinutes\":24,\"rating\":7.9,\"airDate\":\"2002-11-28\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48993,\"tmdbId\":908135,\"number\":10,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Floresta do Chakra\",\"overview\":\"Recuperando-se na casa de Tazuna, Kakashi est\u00e1 insatisfeito com o resultado da batalha.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/mgSDvvVi16W2jDvulu5kHr3Zsrs.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2002-12-05\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48994,\"tmdbId\":908136,\"number\":11,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Terra Onde uma Vez um Her\u00f3i Viveu\",\"overview\":\"Sakura vai \u00e0 cidade com Tazuna e v\u00ea como o povo da Terra das Ondas sofre com o governo de Gato. Enquanto isso, Naruto e Sasuke continuam a treinar, tentando escalar uma \u00e1rvore usando o chakra.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/cvhg1zkpVk67Nap3L9vCmmjhWVZ.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2002-12-12\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48995,\"tmdbId\":908137,\"number\":12,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Batalha na Ponte! Zabuza Retorna!\",\"overview\":\"Enquanto Naruto se concentra em seu treino de chakra, ele \u00e9 abordado por uma pessoa misteriosa.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/2BOgs1XwMqakMbh55nFeWO1ad31.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2002-12-19\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48996,\"tmdbId\":908138,\"number\":13,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Jutsu Secreto de Haku: Espelhos de Cristais de Gelo\",\"overview\":\"Mais uma vez, chega a hora de enfrentar Zabusa, e desta vez ele tem companhia - o ninja rastreador que tentou lhe matar.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/rxmDDbuvKzAEmBljTXEntUFJBbS.jpg\",\"runtimeMinutes\":24,\"rating\":7.1,\"airDate\":\"2002-12-26\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48997,\"tmdbId\":908139,\"number\":14,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Ninja N\u00famero Um, Hiperativo e Cabe\u00e7a Oca Entra na Briga!\",\"overview\":\"Sasuke est\u00e1 preso nos Espelhos de Cristais de Gelo de Haku, mas Naruto vem lhe salvar.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/dsNUKjlGPBKIoH1XYzr25IDxYum.jpg\",\"runtimeMinutes\":24,\"rating\":6.7,\"airDate\":\"2003-01-09\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48998,\"tmdbId\":908140,\"number\":15,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Visibilidade Zero! O Sharingan Desvendado\",\"overview\":\"Ao perceber que lhe resta pouco tempo, Kakashi decide usar o Sharingan novamente para derrotar Zabuza.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/480oLCtY8CkKySvOeO0MyBbMI1b.jpg\",\"runtimeMinutes\":24,\"rating\":7.1,\"airDate\":\"2003-01-16\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":48999,\"tmdbId\":908141,\"number\":16,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Selo Rompido\",\"overview\":\"Naruto e Sasuke continuam a receber ataques inclementes dos Espelhos de Cristais de Gelo do Haku.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/AntqxDoUOQkiuWfCQohBubKKA7.jpg\",\"runtimeMinutes\":24,\"rating\":7.2,\"airDate\":\"2003-01-23\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49000,\"tmdbId\":908142,\"number\":17,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Passado Branco, Ambi\u00e7\u00e3o Escondida\",\"overview\":\"Naruto finalmente explode! Sua f\u00faria contra Haku, que derrotou Sasuke, desperta o poder da Raposa de Nove Caudas.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/d0FSZc0LLbdEwhZ829dxpCN9b5t.jpg\",\"runtimeMinutes\":24,\"rating\":7.2,\"airDate\":\"2003-01-30\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49001,\"tmdbId\":908143,\"number\":18,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"As Armas Conhecidas Como Shinobi\",\"overview\":\"Naruto questiona fortemente a filosofia de Haku, que vive apenas pra lutar e vencer. Enquanto isso, a batalha entre Kakashi e Zabuza aproxima-se de seu cl\u00edmax.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/fWq5VAWWX2PQ8dZUFvmN8w095tb.jpg\",\"runtimeMinutes\":24,\"rating\":7.4,\"airDate\":\"2003-02-06\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49002,\"tmdbId\":908144,\"number\":19,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Dem\u00f4nio na Neve\",\"overview\":\"Com Haku em mente, Naruto confronta Zabuza furiosamente. Zabuza est\u00e1 devastado com a perda de Haku, a \u00fanica pessoa do mundo em quem ele confiava.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/vEo04e0vR3tySztQoLVgrBpiVIa.jpg\",\"runtimeMinutes\":24,\"rating\":8.3,\"airDate\":\"2003-02-13\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49003,\"tmdbId\":908145,\"number\":20,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Um Novo Cap\u00edtulo Come\u00e7a: A Prova Chunin\",\"overview\":\"Ap\u00f3s a batalha na Terra das Ondas, Naruto e seu time retornam \u00e0 Vila Oculta da Folha.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/r6DTT3moIK4CgU5OpmByLdOCU1x.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2003-02-20\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49004,\"tmdbId\":908146,\"number\":21,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Identifiquem-se: Rivais Novos e Poderosos\",\"overview\":\"Naruto, Sasuke e Sakura s\u00e3o selecionados para realizar o Exame de Qualifica\u00e7\u00e3o Chuunin (ninja n\u00edvel m\u00e9dio).\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/lTZR0D5mFCmjGqUsvn66QxC0SAO.jpg\",\"runtimeMinutes\":24,\"rating\":6.5,\"airDate\":\"2003-02-27\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49005,\"tmdbId\":908147,\"number\":22,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Desafio Chunin: Rock Lee Contra Sasuke!\",\"overview\":\"Enquanto Naruto, Sasuke e Sakura se preparam para o exame, surge um ninja com cabelo tigelinha e grossas sobrancelhas chamado Rock Lee, que desafia Sasuke para um duelo.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/2YRIgqJVVAycZ0ZZfIN4GQ169qM.jpg\",\"runtimeMinutes\":24,\"rating\":7.5,\"airDate\":\"2003-03-06\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49006,\"tmdbId\":908148,\"number\":23,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Batalha Genin! Os Nove Novatos se Enfrentam!\",\"overview\":\"Naruto, Sasuke e Sakura se registram oficialmente para o Exame Chunin. Neste exame, os ninjas se dividem em times de tr\u00eas e, para passar, precisam garantir que nenhum dos membros fracasse. Para ser bem-sucedido neste teste, trabalho em equipe \u00e9 fundamental.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/8cusxVCLl6Vhz8z6EwLAvEPp0bV.jpg\",\"runtimeMinutes\":24,\"rating\":6.5,\"airDate\":\"2003-03-13\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49007,\"tmdbId\":908149,\"number\":24,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Liguem os Motores: A Prova Chunin Come\u00e7a!\",\"overview\":\"Naruto e seu time come\u00e7am a primeira prova: um teste escrito. O avaliador do exame \u00e9 um jonin (ninja n\u00edvel superior) chamado Ibiki Morino, um famoso expert em interroga\u00e7\u00e3o.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/9GXCX3b9hBg2Dke5Y2UQTdC3h5T.jpg\",\"runtimeMinutes\":24,\"rating\":6.9,\"airDate\":\"2003-03-20\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49008,\"tmdbId\":908150,\"number\":25,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A D\u00e9cima Pergunta: Tudo ou Nada\",\"overview\":\"O avaliador declara o que parece ser uma regra dura para a pergunta 10, a parte mais dif\u00edcil do primeiro exame.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/ggsD7py8c7EDWHheDq2fMeM5JbS.jpg\",\"runtimeMinutes\":24,\"rating\":7.3,\"airDate\":\"2003-03-27\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49009,\"tmdbId\":908151,\"number\":26,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Reportagem Especial: Ao Vivo da Floresta da Morte!\",\"overview\":\"Konohamaru, neto do Terceiro Hokage da Vilha da Folha, aparece no local do Exame Chunin.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/c82OEFZfwvhIYDu4L2Wkiu0AidQ.jpg\",\"runtimeMinutes\":24,\"rating\":5.3,\"airDate\":\"2003-04-02\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49010,\"tmdbId\":908152,\"number\":27,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Prova Chunin 2\u00aa Etapa: A Floresta da Morte!\",\"overview\":\"Naruto e seus colegas chegam \u00e0 Floresta da Morte, local da segunda fase do Exame Chunin.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/e0GGbezmLS5SVYTgAHQEnB2pfXE.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2003-04-02\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49011,\"tmdbId\":908153,\"number\":28,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Comer ou Ser Comido: P\u00e2nico na Floresta\",\"overview\":\"O segundo exame se passa na Floresta da Morte, e Sasuke percebe que um dos inimigos se disfar\u00e7ou de Naruto.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/uUuQV1Ywfo4ZLyt5qS67sV64PzT.jpg\",\"runtimeMinutes\":24,\"rating\":7.3,\"airDate\":\"2003-04-09\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49012,\"tmdbId\":908154,\"number\":29,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Contra-Ataque de Naruto: Nunca se Renda!\",\"overview\":\"Sasuke e Sakura n\u00e3o d\u00e3o conta de enfrentar o ninja da Grama que os atacou.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/xO0wT3hZ7BA5ejNGqxYM4rDkrLo.jpg\",\"runtimeMinutes\":24,\"rating\":7.6,\"airDate\":\"2003-04-16\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49013,\"tmdbId\":908155,\"number\":30,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Sharingan Revivido: Jutsu Chama do Drag\u00e3o!\",\"overview\":\"Ao ver Naruto enfrentar o ninja da Grama, Sasuke percebe que n\u00e3o deveria ter tentado fugir da batalha.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/fow6cCMvQDNTZd4pojbB5n9Biw1.jpg\",\"runtimeMinutes\":24,\"rating\":7.8,\"airDate\":\"2003-04-23\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49014,\"tmdbId\":908156,\"number\":31,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Promessa do Sobrancelhudo: Amor Eterno e Prote\u00e7\u00e3o!!\",\"overview\":\"Ap\u00f3s um relat\u00f3rio de sua equipe, Anko pressente que Orochimaru se infiltrou no exame.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/8O4ZB71t8avTJlfeWgjYshH9uO3.jpg\",\"runtimeMinutes\":24,\"rating\":6.9,\"airDate\":\"2003-04-30\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49015,\"tmdbId\":908157,\"number\":32,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Sakura Floresce!\",\"overview\":\"Protegendo Sakura, incapaz de se mover, Lee enfrenta sozinho os tr\u00eas ninjas do Som.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/upF0XMGkN88cNW5EJ9Fcvrn3BjK.jpg\",\"runtimeMinutes\":24,\"rating\":7.4,\"airDate\":\"2003-05-07\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49016,\"tmdbId\":908158,\"number\":33,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Forma\u00e7\u00e3o de Batalha: Ino-Shika-Cho!\",\"overview\":\"Sakura se defende dos ataques do ninja do Som, at\u00e9 que o time rival da Ino aparece!\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/o27QYKY0FWstxJkLaw8k19VMHi1.jpg\",\"runtimeMinutes\":24,\"rating\":7.1,\"airDate\":\"2003-05-14\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49017,\"tmdbId\":908159,\"number\":34,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Akamaru Treme: A For\u00e7a Cruel de Gaara\",\"overview\":\"Ap\u00f3s presenciar o poder intenso de Sasuke, o ninja do Som recua. O time de Naruto ganha um momento para se recompor.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/lgaCuu47RnTkJFSaTGE8oVr0D79.jpg\",\"runtimeMinutes\":24,\"rating\":6.7,\"airDate\":\"2003-05-21\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49018,\"tmdbId\":908160,\"number\":35,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Segredo do Pergaminho: N\u00e3o \u00e9 Permitido Olhar\",\"overview\":\"Para se curar da batalha contra o ninja do Som, Naruto e seu time fazem um merecido descanso. Contudo, eles s\u00f3 t\u00eam mais um dia para completar a prova antes do tempo acabar.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/d8LGgOxvDIJgBpBIgypfOT0eJg5.jpg\",\"runtimeMinutes\":24,\"rating\":6.1,\"airDate\":\"2003-05-28\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49019,\"tmdbId\":1144958,\"number\":36,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Clone Contra Clone: Os Meus S\u00e3o Melhores do que os Seus!\",\"overview\":\"O time de Naruto se une a Kabuto na jornada rumo \u00e0 torre, mas acabam presos na t\u00e9cnica ilus\u00f3ria do time de Oboro, ninja da Vila Oculta da Chuva.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/p4k6c0ElCzJfn8ixALdQprUbBXq.jpg\",\"runtimeMinutes\":24,\"rating\":7,\"airDate\":\"2003-06-04\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49020,\"tmdbId\":1144961,\"number\":37,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Sobrevivendo ao Corte: Os Nove Novatos Juntos Outra Vez!\",\"overview\":\"Naruto e seu time alcan\u00e7am a torre e abrem os dois pergaminhos. \u00c9 ent\u00e3o que, subitamente, aparece Iruka.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/rJhRWpsbk4cVwQsHcql10UalGOB.jpg\",\"runtimeMinutes\":24,\"rating\":6.6,\"airDate\":\"2003-06-11\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49021,\"tmdbId\":1145015,\"number\":38,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Estreitando o Campo, Morte S\u00fabita, Elimina\u00e7\u00e3o!\",\"overview\":\"Os 21 ninjas que passaram pelo segundo exame se re\u00fanem para descobrir qual ser\u00e1 seu pr\u00f3ximo desafio.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/kEUY1p3yB2zuzs6G0J9zRa3n5vA.jpg\",\"runtimeMinutes\":24,\"rating\":6.9,\"airDate\":\"2003-06-18\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49022,\"tmdbId\":1145016,\"number\":39,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"O Ci\u00fame do Sobrancelhudo: A Rajada de Le\u00f5es se Solta!\",\"overview\":\"O terceiro exame come\u00e7a com combates de um contra um, e a primeira luta \u00e9 entre Sasuke e Yoroi, assecla de Orochimaru.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/yqXPIz1zU9g4FHbma3Hw4ZwzBv.jpg\",\"runtimeMinutes\":24,\"rating\":7.5,\"airDate\":\"2003-07-02\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49023,\"tmdbId\":1145020,\"number\":40,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Kakashi e Orochimaru Cara a Cara\",\"overview\":\"Quando Kakashi liberta Sasuke do feiti\u00e7o, Orochimaru aparece e declara seu desejo de obter o poder do Sharingan dos Uchiha para conquistar seus des\u00edgnios.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/ttIRnPMOec3EeQ6DScu0SR2OtnW.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2003-07-09\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49024,\"tmdbId\":1145021,\"number\":41,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Explos\u00e3o Kunoichi, As Rivais se Enfrentam!\",\"overview\":\"As eliminat\u00f3rias continuam, e a pr\u00f3xima luta p\u00f5e o ninja da Areia Kankuro contra o assecla Musumi.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/3kBlIN2qODUZrcu2POv2mG3l2dZ.jpg\",\"runtimeMinutes\":24,\"rating\":6.8,\"airDate\":\"2003-07-16\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49025,\"tmdbId\":1145022,\"number\":42,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Batalha Final: Cha!\",\"overview\":\"A quarta luta \u00e9 entre Sakura e Ino, amigas de inf\u00e2ncia e rivais que disputam a aten\u00e7\u00e3o de Sasuke.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/mje94QnuzJ0i3E9T41Et5wP5ws.jpg\",\"runtimeMinutes\":24,\"rating\":7.1,\"airDate\":\"2003-07-23\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49026,\"tmdbId\":1145023,\"number\":43,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"A Kunoichi Assassina e o Tremulo Shikamaru\",\"overview\":\"A quinta luta \u00e9 entre Tenten e Temari. A sexta luta \u00e9 entre Shikamaru e Kin.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/cfyppAV2k3JNOk2w3OSNpy3iXSd.jpg\",\"runtimeMinutes\":24,\"rating\":7.4,\"airDate\":\"2003-07-30\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49027,\"tmdbId\":1145527,\"number\":44,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Akamaru se Revela: Quem \u00e9 o Melhor Cachorro?\",\"overview\":\"Na s\u00e9tima luta, Naruto enfrenta Kiba, que vem acompanhado de seu c\u00e3o Akamaru.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/99FrIir3fl2I4THjM8SMvmSj3MI.jpg\",\"runtimeMinutes\":24,\"rating\":7.2,\"airDate\":\"2003-08-06\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49028,\"tmdbId\":1145528,\"number\":45,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Ataque Surpresa: A Arma Secreta de Naruto!\",\"overview\":\"Ao consumir P\u00edlulas de Comida, Kiba e Akamaru aumentam seus n\u00edveis de chakra e iniciam o contra-ataque contra Naruto.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/bE7SGcJpYQ7nQOgepW8awRopLbC.jpg\",\"runtimeMinutes\":24,\"rating\":7.4,\"airDate\":\"2003-08-13\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49029,\"tmdbId\":1145529,\"number\":46,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Batalha Byakugan: Hinata Ganha Coragem!\",\"overview\":\"Os primos Hinata e Neji do cl\u00e3 Hyuga se enfrentam na oitava luta.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/799bK1KRz4M2YrMGyXI1Y1VZmhX.jpg\",\"runtimeMinutes\":24,\"rating\":7.6,\"airDate\":\"2003-08-20\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49030,\"tmdbId\":1145530,\"number\":47,\"seasonNumber\":1,\"seasonId\":2017,\"title\":\"Uma Derrota Digna!!\",\"overview\":\"Hinata enfrenta Neji, mas ele usa seu Byakugan para atingir seus pontos de press\u00e3o. O fluxo de chakra de Hinata \u00e9 interrompido, e ela quase perde a consci\u00eancia.\",\"stillUrl\":\"https://image.tmdb.org/t/p/w780/hgUDkVN629NTuACZK4ucL24H7ij.jpg\",\"runtimeMinutes\":24,\"rating\":7.5,\"airDate\":\"2003-08-27\",\"audio\":\"dub\",\"streamEnabled\":true,\"adUnlockEnabled\":false,\"hasRecap\":false,\"recapSkipSeconds\":0,\"subtitles\":[]},{\"id\":49031,\"tmdbId\":1145531,\"number\":48,\"seasonNumber\":1,\"s
